// ============================================================================
// QWTF Live - Standalone Race Mode Server Configuration (race_server.cfg)
// Place inside your server's fortress/ directory
// ============================================================================

hostname "QWTF.org/Race [Phoenix]"
sv_gamename "FortressOne"
serverinfo gamename "FortressOne"
serverinfo gametype "qwtflive"
serverinfo status "Waiting for racers"
gamedir fortress
sv_gamedir fortress
set sv_progs "qwprogs.dat"
set sv_nqplayerphysics 0
localinfo motd1                 "QWTF Live Discord: https://discord.qwtf.live"
localinfo motd2                 "QWTF Chronicles: https://qwtf.org"
localinfo motd3                 "Pick map: cmd votemap [mapname]"
sv_public 1
net_masterextra3 ""
//net_masterextra3 "dpmaster.tchr.no:27950"

// Core Race Mode & Staging/Quad Parity Settings
teamplay 1
timelimit 0
fraglimit 0
localinfo race_mode 1
localinfo clan off
localinfo quadmode off
localinfo duelmode off
localinfo fologinrequired 0
localinfo loginrequired 0
localinfo uda off
localinfo default on
localinfo new_balance 1
localinfo omc 1
localinfo sf on
localinfo stf on
localinfo soc on
localinfo srd on
localinfo rj 1
maxclients 8
map poop

// Optional: Set a Discord Webhook URL to auto-announce new #1 map records
// localinfo discord_webhook "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"

// Optional Admin Password
localinfo adminpwd ""

// Network & Physics (Staging/Quad 77fps standard)
sv_mintic 0.013
sv_maxtic 0.013
sv_maxspeed 500
sv_spectalk 1
sv_antilag 1
sv_friction 6
sv_gravity 800
pm_airstep 1
pm_pground 0
pm_ktjump 0.5
pm_autobunny 1
pm_slidefix 0
pausable 0
allow_download 1
allow_download_maps 1
allow_download_models 1
allow_download_sounds 1
